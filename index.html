  <!-- Global Error Handler to catch and display any render anomalies -->
  <script>
    window.addEventListener('error', function(e) {
      console.error("Caught error:", e);
      var errEl = document.getElementById('runtime-error-banner');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'runtime-error-banner';
        errEl.style.cssText = 'position:fixed;bottom:20px;left:20px;right:20px;background:#7f1d1d;color:#fee2e2;padding:16px;border-radius:12px;font-family:monospace;font-size:13px;z-index:999999;border:1px solid #ef4444;box-shadow:0 10px 25px rgba(0,0,0,0.8);white-space:pre-wrap;max-height:40vh;overflow-y:auto;';
        document.body ? document.body.appendChild(errEl) : document.documentElement.appendChild(errEl);
      }
      errEl.innerHTML = '<strong>⚠️ JavaScript / Render Notice:</strong><br>' + (e.message || e) + (e.lineno ? ' (Line ' + e.lineno + ')' : '');
    });
  </script>

    // ==========================================
    // RADIAL SCORE GAUGE (Fully Responsive)
    // ==========================================
    function RadialScoreGauge({ score, size = 120, strokeWidth = 10, themeColor }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = radius * 2 * Math.PI;
      const strokeDashoffset = circumference - (score / 100) * circumference;

      let strokeColor = themeColor || "var(--primary)";
      let statusText = "OPTIMAL";
      let textColor = "text-emerald-400";

      if (score < 60) {
        strokeColor = "#F43F5E";
        statusText = "CRITICAL";
        textColor = "text-rose-400";
      } else if (score < 80) {
        strokeColor = "#F59E0B";
        statusText = "STALE DRIFT";
        textColor = "text-amber-400";
      } else {
        textColor = "text-emerald-400";
      }

      return (
        <div className="relative flex flex-col items-center justify-center flex-shrink-0">
          <svg width={size} height={size} className="transform -rotate-90">
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke="rgba(255, 255, 255, 0.08)"
              strokeWidth={strokeWidth}
              fill="none"
            />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke={strokeColor}
              strokeWidth={strokeWidth}
              strokeDasharray={circumference}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
              fill="none"
              style={{ transition: 'stroke-dashoffset 1s ease-in-out, stroke 0.5s ease' }}
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="text-2xl sm:text-3xl font-extrabold tracking-tight text-white font-mono">
              {score}%
            </span>
            <span className={`text-[9px] sm:text-[10px] font-bold tracking-wider uppercase ${textColor}`}>
              {statusText}
            </span>
          </div>
        </div>
      );
    }

                  severity: 'Warning',
                  title: 'Action Button / CTA Mismatch',
                  description: 'Primary submission button styling and transport security attributes differ from the live compliance standard.'
                }
              ],
              differences: [
                {
                  element: 'Form Container & Layout',
                  before: 'Legacy baseline dimensions & borders',
                  after: 'Current responsive viewport specs',
                  impact: 'Visual Drift'
                },
                {
                  element: 'Security & Auth Controls',
                  before: 'Un-scoped input fields',
                  after: 'Tokenized modern input structure',
                  impact: 'Compliance Gap'
                }
              ]
            };
          });
        };
        reader.readAsDataURL(file);
      };

      // Submit from Image Mode
      const handleSaveVisualSource = () => {
        setIsSubmitting(true);
        setTimeout(() => {
          const newSource = {
            id: `src-vis-${Date.now()}`,
            name: customAuditData.sourceName || customAuditData.title,
            url: customAuditData.sourceUrl || 'https://custom-form-audit.internal',
            category: customAuditData.category || 'Visual Forms',
            status: customAuditData.verdict,
            freshnessScore: customAuditData.score,
            lastScanned: 'Just now',
            checkFrequency: 'Daily',
            outdatedCount: customAuditData.verdict === 'Outdated' ? customAuditData.differences.length : 0,
            hasVisualAudit: true,
            visualAudit: customAuditData,
            outdatedItems: customAuditData.verdict === 'Outdated' ? [
              {
                id: `out-vis-${Date.now()}`,
                severity: 'Critical',
                title: customAuditData.reasons[0]?.title || 'Visual Form Discrepancy',
                location: 'Visual Snapshot Diff',
                outdatedSnippet: '<form class="legacy-outdated">\n  <input type="password" name="pwd" />\n</form>',
                whyOutdated: customAuditData.reasons[0]?.description || 'Form is outdated compared to 2026 production baseline.',
                suggestedFix: '<form class="modern-2026">\n  <button type="button">🔑 Sign in with Passkey</button>\n</form>',
                detectedAt: 'Just now'
              }
            ] : [],
            freshHighlights: customAuditData.verdict === 'Fresh' ? ['Visual layout matches 2026 specifications with zero drift.'] : [],
            aiSummary: customAuditData.summary
          };

          setIsSubmitting(false);
          onAdd(newSource);
        }, 600);
      };

      // Submit from URL Mode
      const handleUrlSubmit = (e) => {
        e.preventDefault();
        if (!name.trim() || !url.trim()) return;

        setIsSubmitting(true);

        setTimeout(() => {
          const isOutdatedSim = url.toLowerCase().includes('compose') || url.toLowerCase().includes('v1');
          const score = isOutdatedSim ? 54 : 94;
          const status = isOutdatedSim ? 'Outdated' : 'Fresh';

          const newSource = {
            id: `src-${Date.now()}`,
            name: name.trim(),
            url: url.trim(),
            category,
            status,
            freshnessScore: score,
            lastScanned: 'Just now',
            checkFrequency,
            outdatedCount: isOutdatedSim ? 2 : 0,
            outdatedItems: isOutdatedSim ? [
              {
                id: `out-${Date.now()}`,
                severity: 'Critical',
                title: 'Deprecated version key in compose file',
                location: 'Section: Configuration Specification',
                outdatedSnippet: "version: '3.8'\nservices:\n  web:\n    image: node:14",
                whyOutdated: "The version attribute is obsolete in Compose Specification. Node 14 is EOL.",
                suggestedFix: "services:\n  web:\n    image: node:20-alpine",
                detectedAt: 'Just now'
              }
            ] : [],
            freshHighlights: !isOutdatedSim ? [
              'Syntactic ground-truth verified.',
              'No broken endpoints or expired libraries detected.'
            ] : [],
            aiSummary: isOutdatedSim
              ? 'AI Detected 2 stale configuration elements in code samples.'
              : 'All documentation snippets match current 2026 ground-truth release specs.'
          };

          setIsSubmitting(false);
          onAdd(newSource);
        }, 600);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md p-3 sm:p-4 animate-fadeIn overflow-y-auto">
          <div className="w-full max-w-4xl max-h-[92vh] overflow-y-auto p-4 sm:p-6 rounded-2xl glass-panel border border-slate-700/80 shadow-2xl space-y-4 sm:space-y-5 my-auto">
            
            {/* Modal Header */}
            <div className="flex items-center justify-between pb-3 border-b border-slate-800">
              <div className="flex items-center gap-2.5">
                <div 
                  className="w-8 h-8 rounded-xl border flex items-center justify-center flex-shrink-0"
                  style={{
                    backgroundColor: 'var(--primary-badge-bg)',
                    borderColor: 'var(--primary-border)',
                    color: 'var(--primary-light)'
                  }}
                >
                  <Icon.Plus className="w-4 h-4 stroke-[2.5]" />
                </div>
                <div>
                  <h3 className="text-sm sm:text-base font-bold text-white">Add Source to Freshness Monitor</h3>
                  <p className="text-xs text-slate-400">Track web documentation URLs or compare form screenshots</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <Icon.X className="w-4 h-4" />
              </button>
            </div>

            {/* Mode Switcher Tabs */}
            <div className="flex items-center gap-2 p-1.5 rounded-xl bg-slate-900 border border-slate-800">
              <button
                type="button"
                onClick={() => setMode('image')}
                className={`flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-semibold transition ${
                  mode === 'image' 
                    ? 'bg-gradient-to-r from-brand-600/30 to-indigo-600/30 text-brand-300 border border-brand-500/40 shadow-md' 
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon.Image className="w-4 h-4 text-brand-400" />
                <span>📸 Visual Form / Image Comparison</span>
                <span className="px-1.5 py-0.2 rounded text-[9px] bg-brand-500/30 text-brand-200 font-mono">AI DIFF</span>
              </button>
              
              <button
                type="button"
                onClick={() => setMode('url')}
                className={`flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-semibold transition ${
                  mode === 'url' 
                    ? 'bg-slate-800 text-white border border-slate-700 shadow-md' 
                    : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <Icon.Globe className="w-4 h-4" />
                <span>🌐 Website URL Crawler</span>
              </button>
            </div>

            {/* MODE 1: VISUAL IMAGE & FORM COMPARISON */}
            {mode === 'image' && (
              <div className="space-y-4">
                
                {/* Preset Scenarios Selector */}
                <div className="space-y-1.5">
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-semibold text-slate-300 flex items-center gap-1.5">
                      <span>Select Test Scenario or Upload Your Own Images:</span>
                    </label>
                    <span className="text-[10px] text-slate-500 font-mono">1-Click Scenarios</span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {VISUAL_PRESETS.map((preset) => (
                      <button
                        key={preset.id}
                        type="button"
                        onClick={() => handleSelectVisualPreset(preset)}
                        className={`p-2 rounded-xl text-left border transition text-xs flex flex-col justify-between ${
                          selectedPresetId === preset.id
                            ? 'bg-brand-500/20 border-brand-500/60 text-white ring-1 ring-brand-400/40'
                            : 'bg-slate-900 hover:bg-slate-800/80 border-slate-700/80 text-slate-300'
                        }`}
                      >
                        <div className="font-semibold truncate">{preset.title.split(' ')[0]} {preset.title.split(' ')[1]}</div>
                        <div className="flex items-center justify-between mt-1 pt-1 border-t border-slate-800 text-[10px] font-mono">
                          <span className={preset.verdict === 'Outdated' ? 'text-rose-400' : 'text-emerald-400'}>
                            {preset.verdict}
                          </span>
                          <span className="text-slate-400">{preset.score}%</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Custom File Upload Drop Zones */}
                <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs">
                  <div className="flex items-center gap-2">
                    <Icon.Upload className="w-4 h-4 text-brand-400 flex-shrink-0" />
                    <div>
                      <span className="font-semibold text-slate-200">Upload Your Own Screenshots:</span>
                      <p className="text-[11px] text-slate-400">Select any 2 PNG/JPG images from your computer to run custom AI diff</p>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 w-full sm:w-auto">
                    <label className="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 cursor-pointer text-xs transition">
                      <Icon.Image className="w-3.5 h-3.5 text-rose-400" />
                      <span>Upload Image 1 (Old)</span>
                      <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'before')} className="hidden" />
                    </label>

                    <label className="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 cursor-pointer text-xs transition">
                      <Icon.Image className="w-3.5 h-3.5 text-emerald-400" />
                      <span>Upload Image 2 (New)</span>
                      <input type="file" accept="image/*" onChange={(e) => handleFileUpload(e, 'after')} className="hidden" />
                    </label>
                  </div>
                </div>

                {/* FULL VISUAL COMPARISON LAB DISPLAY */}
                <VisualComparisonLab
                  auditData={customAuditData}
                  isSaving={isSubmitting}
                  onSaveToFleet={handleSaveVisualSource}
                  onAutoFix={() => {
                    setCustomAuditData(prev => ({
                      ...prev,
                      verdict: 'Fresh',
                      score: 98,
                      summary: 'Auto-remediation successful: Legacy form elements updated to 2026 ground-truth standards.',
                      reasons: [
                        {
                          severity: 'Verified',
                          title: 'Remediated & Synchronized',
                          description: 'All outdated password inputs, legacy captchas, and direct credit card elements replaced with modern FIDO2/Passkey and tokenized iframe standards.'
                        }
                      ],
                      differences: []
                    }));
                  }}
                />

              </div>
            )}

            {/* MODE 2: WEBSITE URL CRAWLER */}
            {mode === 'url' && (
              <form onSubmit={handleUrlSubmit} className="space-y-4 text-xs">
                
                {/* Quick Demo Presets */}
                <div className="space-y-1.5">
                  <label className="text-[11px] sm:text-xs font-mono text-slate-400">Quick Test Presets:</label>
                  <div className="flex flex-wrap gap-1 sm:gap-1.5">
                    {DEMO_PRESETS.map((preset, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => {
                          setName(preset.name);
                          setUrl(preset.url);
                          setCategory(preset.category);
                          setCheckFrequency(preset.freq);
                        }}
                        className="px-2 sm:px-2.5 py-1 rounded-lg text-[10px] sm:text-[11px] font-mono bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition"
                      >
                        + {preset.name}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="space-y-1">
                  <label className="font-semibold text-slate-300">Source Name</label>
                  <input
                    type="text"
                    required
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="e.g. Anthropic Claude Docs"
                    className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none"
                  />
                </div>

                <div className="space-y-1">
                  <label className="font-semibold text-slate-300">Website URL</label>
                  <input
                    type="url"
                    required
                    value={url}
                    onChange={(e) => setUrl(e.target.value)}
                    placeholder="https://docs.anthropic.com/claude"
                    className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none"
                  />
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                  <div className="space-y-1">
                    <label className="font-semibold text-slate-300">Category</label>
                    <select
                      value={category}
                      onChange={(e) => setCategory(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm sm:text-xs text-slate-200 focus:outline-none"
                    >
                      <option value="Developer Docs">Developer Docs</option>
                      <option value="API Reference">API Reference</option>
                      <option value="SDKs">SDKs</option>
                      <option value="Architecture Specs">Architecture Specs</option>
                      <option value="Pricing & Plans">Pricing & Plans</option>
                      <option value="Terms & Legal">Terms & Legal</option>
                    </select>
                  </div>

                  <div className="space-y-1">
                    <label className="font-semibold text-slate-300">Scan Frequency</label>
                    <select
                      value={checkFrequency}
                      onChange={(e) => setCheckFrequency(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm sm:text-xs text-slate-200 focus:outline-none"
                    >
                      <option value="Every 1 hour">Every 1 hour</option>
                      <option value="Every 6 hours">Every 6 hours</option>
                      <option value="Daily">Daily (Recommended)</option>
                      <option value="Weekly">Weekly</option>
                    </select>
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 rounded-xl text-slate-400 hover:text-white"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    disabled={isSubmitting}
                    className="flex items-center gap-2 px-5 py-2.5 rounded-xl font-semibold transition active:scale-95 disabled:opacity-50"
                    style={{
                      backgroundColor: 'var(--primary-button-bg)',
                      color: 'var(--primary-button-text)',
                      boxShadow: '0 0 16px var(--primary-glow-heavy)'
                    }}
                  >
                    <Icon.Sparkles className="w-4 h-4" />
                    <span>{isSubmitting ? 'Crawling...' : 'Add & Scan URL'}</span>
                  </button>
                </div>
              </form>
            )}

          </div>
        </div>
      );
    }

    // ==========================================
    // RENDER APPLICATION
    // ==========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<InfoFreshApp />);
  </script>
</body>
</html>
